		<div id="bar"><div class="row"><span id="count">0 個</span><button id="copy">コピー</button><button id="stop">止める</button><button id="clear">全部外す</button></div><textarea id="out" readonly></textarea></div>
		<script>
			const KEY = "se-audition-v2";
			let checked = new Set();
			try { checked = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch {}
			const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...checked])); } catch {} };
			const audio = new Audio();
			let cur = null;
			const vol = document.getElementById("vol");
			audio.volume = +vol.value;
			vol.oninput = () => { audio.volume = +vol.value; };
			const stop = () => { audio.pause(); cur?.classList.remove("playing"); cur = null; };
			audio.onended = stop;
			const lis = [...document.querySelectorAll("li")];
			const refresh = () => {
				const sel = lis.filter((li) => checked.has(li.dataset.mp3));
				for (const li of lis) li.classList.toggle("on", checked.has(li.dataset.mp3));
				document.getElementById("count").textContent = sel.length + " 個";
				document.getElementById("out").value = sel.map((li) => "- " + li.dataset.title + " " + li.dataset.mp3).join("\n");
			};
			for (const li of lis) {
				const box = li.querySelector("input");
				box.checked = checked.has(li.dataset.mp3);
				box.onchange = () => { box.checked ? checked.add(li.dataset.mp3) : checked.delete(li.dataset.mp3); save(); refresh(); };
				li.querySelector(".play").onclick = () => {
					if (cur === li) return stop();
					stop(); cur = li; li.classList.add("playing");
					audio.src = li.dataset.mp3; audio.play().catch(stop);
				};
			}
			document.getElementById("stop").onclick = stop;
			document.getElementById("copy").onclick = () => { const t = document.getElementById("out"); t.select(); navigator.clipboard?.writeText(t.value).catch(() => document.execCommand("copy")); };
			document.getElementById("clear").onclick = () => { checked.clear(); save(); for (const li of lis) li.querySelector("input").checked = false; refresh(); };
			refresh();
		</script>
	</body>
</html>
